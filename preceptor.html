<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EMS Preceptor Survey</title>
<style>
  :root {
    --primary: #2563a8;
    --primary-light: #dbeafe;
    --accent: #1d4ed8;
    --success: #16a34a;
    --danger: #dc2626;
    --bg: #f8fafc;
    --card: #ffffff;
    --border: #e2e8f0;
    --text: #1e293b;
    --muted: #64748b;
    --radius: 10px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', 'PingFang TC', 'Noto Sans TC', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 24px 16px 60px;
  }

  /* Header */
  .survey-header {
    background: var(--primary);
    color: white;
    padding: 20px 24px;
    border-radius: var(--radius);
    margin-bottom: 24px;
    text-align: center;
  }
  .survey-header h1 { font-size: 1.2rem; line-height: 1.5; }
  .survey-header p { font-size: 0.85rem; opacity: 0.85; margin-top: 4px; }

  /* Progress */
  .progress-bar {
    background: var(--border);
    border-radius: 99px;
    height: 8px;
    margin-bottom: 20px;
    overflow: hidden;
  }
  .progress-fill {
    background: var(--primary);
    height: 100%;
    border-radius: 99px;
    transition: width 0.4s ease;
  }
  .progress-label {
    text-align: right;
    font-size: 0.8rem;
    color: var(--muted);
    margin-bottom: 6px;
  }

  /* Cards */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    margin-bottom: 16px;
  }

  .section-title {
    font-size: 1rem;
    font-weight: 700;
    color: var(--primary);
    margin-bottom: 4px;
    padding-bottom: 8px;
    border-bottom: 2px solid var(--primary-light);
  }
  .section-sub {
    font-size: 0.82rem;
    color: var(--muted);
    margin-bottom: 16px;
    margin-top: 4px;
  }

  /* Question block */
  .question-block {
    margin-bottom: 22px;
  }
  .question-block:last-child { margin-bottom: 0; }

  .q-label {
    font-size: 0.92rem;
    font-weight: 600;
    margin-bottom: 8px;
    line-height: 1.5;
  }
  .q-num {
    color: var(--primary);
    font-weight: 700;
    margin-right: 4px;
  }
  .q-note {
    font-size: 0.78rem;
    color: var(--danger);
    font-weight: 400;
  }

  /* Radio / Checkbox options */
  .options { display: flex; flex-direction: column; gap: 8px; }
  .option-label {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
    font-size: 0.88rem;
    line-height: 1.4;
  }
  .option-label:hover { background: var(--primary-light); border-color: var(--primary); }
  .option-label input { margin-top: 2px; flex-shrink: 0; accent-color: var(--primary); }
  .option-label.selected { background: var(--primary-light); border-color: var(--primary); }

  /* Likert scale */
  .likert-wrap {
    overflow-x: auto;
    padding-bottom: 4px;
  }
  .likert-table {
    width: 100%;
    min-width: 420px;
    border-collapse: collapse;
  }
  .likert-table th {
    font-size: 0.75rem;
    color: var(--muted);
    text-align: center;
    padding: 4px 2px 8px;
    font-weight: 600;
  }
  .likert-row td {
    text-align: center;
    padding: 6px 2px;
    border-top: 1px solid var(--border);
  }
  .likert-row:hover td { background: var(--primary-light); }
  .likert-row td:first-child {
    text-align: left;
    padding-left: 4px;
    font-size: 0.85rem;
    line-height: 1.4;
    min-width: 200px;
  }
  .likert-row td input[type=radio] { accent-color: var(--primary); width: 18px; height: 18px; cursor: pointer; }

  /* Number input */
  input[type=number], input[type=text] {
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 0.9rem;
    width: 120px;
    outline: none;
    transition: border-color 0.15s;
  }
  input[type=number]:focus, input[type=text]:focus { border-color: var(--primary); }

  /* Buttons */
  .btn-row {
    display: flex;
    gap: 12px;
    justify-content: space-between;
    margin-top: 24px;
  }
  .btn {
    padding: 12px 28px;
    border-radius: 8px;
    border: none;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.1s;
  }
  .btn:active { transform: scale(0.98); }
  .btn-primary { background: var(--primary); color: white; }
  .btn-primary:hover { opacity: 0.9; }
  .btn-secondary { background: var(--border); color: var(--text); }
  .btn-secondary:hover { opacity: 0.8; }
  .btn-success { background: var(--success); color: white; font-size: 1rem; padding: 14px 36px; }

  /* Language selector */
  .lang-card {
    max-width: 480px;
    margin: 80px auto 0;
    text-align: center;
  }
  .lang-card h2 { font-size: 1.3rem; margin-bottom: 8px; }
  .lang-card p { color: var(--muted); font-size: 0.9rem; margin-bottom: 28px; }
  .lang-btns { display: flex; gap: 16px; justify-content: center; }
  .lang-btn {
    padding: 16px 36px;
    border-radius: 10px;
    border: 2px solid var(--primary);
    background: white;
    color: var(--primary);
    font-size: 1.1rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s;
  }
  .lang-btn:hover { background: var(--primary); color: white; }

  /* Consent */
  .consent-box {
    background: #f0f9ff;
    border: 1px solid #bae6fd;
    border-radius: 8px;
    padding: 16px;
    font-size: 0.88rem;
    line-height: 1.8;
    margin-bottom: 16px;
  }
  .consent-box h3 { margin-bottom: 8px; color: var(--primary); }

  /* Thank you */
  .thankyou {
    text-align: center;
    padding: 60px 20px;
  }
  .thankyou .icon { font-size: 3rem; margin-bottom: 16px; }
  .thankyou h2 { font-size: 1.5rem; color: var(--success); margin-bottom: 12px; }
  .thankyou p { color: var(--muted); font-size: 0.95rem; line-height: 1.7; }

  /* Validation */
  .error-msg { color: var(--danger); font-size: 0.8rem; margin-top: 6px; display: none; }
  .has-error .error-msg { display: block; }
  .has-error .option-label { border-color: var(--danger); }
  .has-error input[type=number] { border-color: var(--danger); }

  /* IRB badge */
  .irb-badge {
    display: inline-block;
    background: #f0fdf4;
    border: 1px solid #86efac;
    color: #15803d;
    font-size: 0.75rem;
    padding: 3px 10px;
    border-radius: 99px;
    margin-top: 8px;
  }

  @media (max-width: 600px) {
    .card { padding: 16px; }
    .btn { padding: 10px 18px; font-size: 0.88rem; }
  }

  .hidden { display: none !important; }
</style>
</head>

// ============================================================
// ROUTING HELPERS
// ============================================================
function getQ13Status() { return answers['Q1-3'] || ''; }

function isNovice() {
  const v = getQ13Status();
  return ['1','4'].includes(v);
}

function isAdvanced() {
  const v = getQ13Status();
  return ['2','3','5','7'].includes(v);
}

function isEMT2qualified() {
  return getQ13Status() === '6';
}

function needsPart42() {
  const v = getQ13Status();
  return ['3','5','6','7'].includes(v);
}

function needsQ110() {
  const v = getQ13Status();
  return ['3','6','7'].includes(v);
}

function getTotalPages() {
  return 5;
}

// ============================================================
// RENDER ENGINE
// ============================================================
const app = document.getElementById('app');

function render() {
  if (page === 0) {
    renderLang();
  } else if (page === 1) {
    renderConsent();
  } else if (page === 2) {
    renderPart1();
  } else if (page === 3) {
    renderPart2();
  } else if (page === 4) {
    renderPart3();
  } else if (page === 5) {
    renderPart4();
  } else if (page === 6) {
    renderThankyou();
  }
  updateProgress();
}

function updateProgress() {
  const wrap = document.getElementById('progress-wrap');
  const fill = document.getElementById('progress-fill');
  const label = document.getElementById('progress-text');
  const header = document.getElementById('survey-header');
  const t = T[lang];

  if (page === 0) {
    wrap.classList.add('hidden');
    header.classList.add('hidden');
    return;
  }
  if (page === 6) {
    wrap.classList.add('hidden');
    header.classList.add('hidden');
    return;
  }
  header.classList.remove('hidden');
  document.getElementById('header-title').textContent = t.headerTitle;
  document.getElementById('header-sub').textContent = t.headerSub;

  if (page >= 1 && page <= 5) {
    wrap.classList.remove('hidden');
    const cur = page;
    const total = 5;
    const pct = Math.round((cur / total) * 100);
    fill.style.width = pct + '%';
    label.textContent = t.progress.replace('{cur}', cur).replace('{total}', total);
  }
}

function renderLang() {
  app.innerHTML = `

}

function selectLang(l) {
  lang = l;
  page = 1;
  render();
}

function renderConsent() {

  const val = document.querySelector('input[name="Q1-3"]:checked')?.value || '';

  const wrap = document.getElementById('q110-wrap');
  if (['3','6','7'].includes(val)) {
    wrap.classList.remove('hidden');
  } else {
    wrap.classList.add('hidden');
  }

function renderThankyou() {

// ============================================================
// WIDGET BUILDERS
// ============================================================
function radioQ(name, label, opts, vals, onchange) {
  const qnum = name.replace('Q','').replace('-','-');
  const onChange = onchange ? ` onchange="${onchange}"` : '';
  let html = `<div class="question-block" id="block-${name}">
    <div class="q-label"><span class="q-num">${name}</span>${label}</div>
    <div class="options">`;
  opts.forEach((o, i) => {
    const v = vals[i];
    html += `<label class="option-label">
      <input type="radio" name="${name}" value="${v}"${onChange}> ${o}
    </label>`;
  });
  html += `</div><div class="error-msg">${T[lang].required}</div></div>`;
  return html;
}

function numberQ(name, label) {
  return `<div class="question-block" id="block-${name}">
    <div class="q-label"><span class="q-num">${name}</span>${label}</div>
    <input type="number" id="${name}" name="${name}" min="15" max="80" placeholder="e.g. 25">
    <div class="error-msg">${T[lang].requiredAge}</div>
  </div>`;
}

function likertTable(items, labels, n) {
  let html = `<div class="likert-wrap"><table class="likert-table">
    <tr><th style="text-align:left;min-width:200px"></th>`;
  labels.forEach(l => {
    html += `<th style="white-space:pre-line;font-size:0.7rem">${l}</th>`;
  });
  html += '</tr>';

  items.forEach(item => {
    html += `<tr class="likert-row" id="block-${item.id}">
      <td>${item.id} ${item.text}</td>`;
    for (let v = 1; v <= n; v++) {
      html += `<td><input type="radio" name="${item.id}" value="${v}"></td>`;
    }
    html += '</tr>';
  });

  html += '</table></div>';
  return html;
}

// ============================================================
// VALIDATION
// ============================================================
function validatePage() {
  let ok = true;
  const t = T[lang];

  if (page === 2) {
    const radios = ['Q1-1','Q1-3','Q1-4','Q1-5','Q1-6','Q1-7','Q1-8','Q1-9'];
    radios.forEach(name => {
      const block = document.getElementById('block-' + name);
      if (!block) return;
      const checked = document.querySelector(`input[name="${name}"]:checked`);
      if (!checked) { block.classList.add('has-error'); ok = false; }
      else block.classList.remove('has-error');
    });
    const ageEl = document.getElementById('Q1-2');
    const ageBlock = document.getElementById('block-Q1-2');
    if (!ageEl.value || isNaN(ageEl.value) || +ageEl.value < 15) {
      ageBlock.classList.add('has-error'); ok = false;
    } else ageBlock.classList.remove('has-error');

    if (needsQ110()) {
      ['Q1-10','Q1-11'].forEach(name => {
        const block = document.getElementById('block-' + name);
        if (!block) return;
        const checked = document.querySelector(`input[name="${name}"]:checked`);
        if (!checked) { block.classList.add('has-error'); ok = false; }
        else block.classList.remove('has-error');
      });
    }
  }

  if (page === 3) {
    T[lang].q2items.forEach(item => {
      const row = document.getElementById('block-' + item.id);
      if (!row) return;
      const checked = document.querySelector(`input[name="${item.id}"]:checked`);
      if (!checked) { row.classList.add('has-error'); ok = false; }
      else row.classList.remove('has-error');
    });
  }

  if (page === 4) {
    const items = isNovice() ? T[lang].q3a : T[lang].q3b;
    items.forEach(item => {
      const row = document.getElementById('block-' + item.id);
      if (!row) return;
      const checked = document.querySelector(`input[name="${item.id}"]:checked`);
      if (!checked) { row.classList.add('has-error'); ok = false; }
      else row.classList.remove('has-error');
    });
  }

  if (page === 5) {
    const items = needsPart42() ? T[lang].q4b : T[lang].q4a;
    items.forEach(item => {
      const row = document.getElementById('block-' + item.id);
      if (!row) return;
      const checked = document.querySelector(`input[name="${item.id}"]:checked`);
      if (!checked) { row.classList.add('has-error'); ok = false; }
      else row.classList.remove('has-error');
    });
  }

  if (!ok) {
    const first = document.querySelector('.has-error');
    if (first) first.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
  return ok;
}

// ============================================================
// COLLECT ANSWERS
// ============================================================
function collectAnswers() {
  document.querySelectorAll('input[type=radio]:checked').forEach(el => {
    answers[el.name] = el.value;
  });
  const ageEl = document.getElementById('Q1-2');
  if (ageEl) answers['Q1-2'] = ageEl.value;
  answers['Language'] = lang;
}

// ============================================================
// NAV
// ============================================================
function goNext() {
  collectAnswers();
  if (!validatePage()) return;
  page++;
  window.scrollTo(0, 0);
  render();
}

function goBack() {
  page--;
  if (page < 1) page = 1;
  window.scrollTo(0, 0);
  render();
}

// ============================================================
// RESTORE
// ============================================================
function restoreRadios() {
  Object.keys(answers).forEach(name => {
    const val = answers[name];
    const el = document.querySelector(`input[name="${name}"][value="${val}"]`);
    if (el) {
      el.checked = true;
      el.closest('label')?.classList.add('selected');
    }
  });
}

function restoreNumber(name) {
  const el = document.getElementById(name);
  if (el && answers[name]) el.value = answers[name];
}

// ============================================================
// SUBMIT  (改用 fetch 呼叫 GAS Web App，取代 google.script.run)
// ============================================================
function submitSurvey() {
  collectAnswers();
  if (!validatePage()) return;

  const btn = document.getElementById('submit-btn');
  btn.disabled = true;
  btn.textContent = T[lang].submitting;

  fetch(GAS_WEB_APP_URL, {
    method: 'POST',
    // 用 text/plain 避免瀏覽器發出 CORS preflight (OPTIONS)，
    // GAS 端還是能用 JSON.parse(e.postData.contents) 正常解析
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(answers)
  })
    .then(res => res.json())
    .then(data => {
      if (data.status === 'ok') {
        page = 6;
        render();
      } else {
        throw new Error(data.message || 'Unknown error');
      }
    })
    .catch(err => {
      btn.disabled = false;
      btn.textContent = T[lang].submit;
      document.getElementById('submit-error').style.display = 'block';
      console.error(err);
    });
}

// ============================================================
// BOOT
// ============================================================
render();
</script>
